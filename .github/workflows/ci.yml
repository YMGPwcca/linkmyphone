name: ci

on:
  workflow_dispatch:
  push:
    branches: [feature/clipboard-content]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install clipboard integration test providers
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip python3-gi gir1.2-gtk-4.0
      - run: go vet ./...
      - run: go build ./cmd/linkmyphone
      - name: Full suite, race detector and real X11 MIME transfers
        env:
          LINKMYPHONE_NATIVE_INTEGRATION: "1"
        run: xvfb-run -a go test -race ./...
