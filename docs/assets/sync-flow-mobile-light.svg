<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">LinkMyPhone's current clipboard feature</title>
  <desc id="desc">The first implemented LinkMyPhone feature: clipboard text travels in both directions between Linux and Link to Windows on Android through Microsoft's DCG and Hub Relay services. This diagram does not represent the full scope of the project.</desc>
  <style>
    svg { --surface: #f6f8fa; --ink: #1f2328; --secondary: #57606a; --border: #d1d9e0; --flow: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .label { font-size: 24px; font-weight: 600; }
    .sub { font-size: 20px; fill: var(--secondary); }
    .device { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .connection { fill: none; stroke: var(--flow); stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#0969da"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="359" height="419" rx="16" fill="var(--surface)" stroke="var(--border)"/>
  <g class="device">
    <rect x="48" y="32" width="60" height="42" rx="6"/>
    <path d="M78 74v11m-18 0h36"/>
    <rect x="69" y="43" width="18" height="21" rx="2"/>
    <path d="M73 43v-3h10v3m-9 8h8m-8 6h8"/>
    <path d="M57 207h43a15 15 0 0 0 1-30 23 23 0 0 0-43-5 18 18 0 0 0-1 35Z"/>
    <rect x="58" y="298" width="40" height="68" rx="8"/>
    <path d="M71 306h14m-7 49h0.1"/>
    <rect x="69" y="319" width="18" height="22" rx="2"/>
    <path d="M73 319v-3h10v3m-9 8h8m-8 6h8"/>
  </g>
  <path class="connection" d="M78 102v45"/>
  <path class="connection" d="M78 230v48"/>
  <text class="label" x="133" y="53">Linux</text>
  <text class="sub" x="133" y="80">Wayland / X11</text>
  <text class="label" x="133" y="183">Microsoft cloud</text>
  <text class="sub" x="133" y="210">DCG + Hub Relay</text>
  <text class="label" x="133" y="328">Android</text>
  <text class="sub" x="133" y="355">Link to Windows</text>
  <text x="180" y="397" text-anchor="middle" font-size="18" fill="var(--secondary)">Two-way plain-text sync</text>
</svg>
