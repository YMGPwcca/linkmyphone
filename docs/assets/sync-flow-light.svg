<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" role="img" aria-labelledby="title desc">
  <title id="title">LinkMyPhone's current clipboard feature</title>
  <desc id="desc">The first implemented LinkMyPhone feature: text, HTML and images travel in both directions between Linux and Link to Windows on Android through Microsoft's DCG and Hub Relay services. This diagram does not represent the full scope of the project.</desc>
  <style>
    svg { --surface: #f6f8fa; --ink: #1f2328; --secondary: #57606a; --border: #d1d9e0; --flow: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .label { font-size: 28px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 18px; fill: var(--secondary); text-anchor: middle; }
    .device { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .connection { fill: none; stroke: var(--flow); stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#0969da"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="239" rx="16" fill="var(--surface)" stroke="var(--border)"/>
  <g class="device">
    <rect x="106" y="48" width="68" height="46" rx="6"/>
    <path d="M140 94v12m-20 0h40"/>
    <rect x="131" y="60" width="18" height="22" rx="2"/>
    <path d="M136 60v-3h8v3m-8 9h8m-8 6h8"/>
    <path d="M404 96h53a17 17 0 0 0 2-34 28 28 0 0 0-53-6 20 20 0 0 0-2 40Z"/>
    <rect x="697" y="39" width="46" height="73" rx="9"/>
    <path d="M712 47h16m-8 53h0.1"/>
    <rect x="710" y="61" width="20" height="24" rx="2"/>
    <path d="M715 61v-3h10v3m-10 10h10m-10 6h10"/>
  </g>
  <path class="connection" d="M205 78h145"/>
  <path class="connection" d="M510 78h145"/>
  <text class="label" x="140" y="153">Linux</text>
  <text class="sub" x="140" y="182">Wayland / X11</text>
  <text class="label" x="430" y="153">Microsoft cloud</text>
  <text class="sub" x="430" y="182">DCG + Hub Relay</text>
  <text class="label" x="720" y="153">Android</text>
  <text class="sub" x="720" y="182">Link to Windows</text>
  <text class="sub" x="430" y="218">Text · HTML · Image sync</text>
</svg>
